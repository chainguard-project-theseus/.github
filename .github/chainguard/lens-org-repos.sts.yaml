# Octo STS policy for the Lens hub's Depthfirst coverage views (LensSecureSDLC).
# The hub mints a short-lived token to list this org's repos
# (GET /orgs/{org}/repos) and flags the ones Depthfirst doesn't track. Listing
# needs only repo metadata. Org-scoped (repositories: []) so private repos are
# listed too.
#
# Federates the hub Cloud Run service accounts by their Google numeric uniqueId:
#   preview: linear-dashboard-sa@jrawlings2-chainguard-dev.iam.gserviceaccount.com
#            uniqueId 106033804611612894562
#   prod:    lens-sa@eng-observability.iam.gserviceaccount.com
#            uniqueId 116438120363188640248

issuer: https://accounts.google.com
subject_pattern: "^(106033804611612894562|116438120363188640248)$"

permissions:
  metadata: read

repositories: []  # Act over all of the repos in the org.
